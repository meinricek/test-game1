<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Noční směna</title>
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>

      <!-- HUD -->
      <div id="hud" class="hidden">
        <div id="objectives"></div>
        <div id="crosshair"></div>
        <div id="prompt" class="hidden"></div>
        <div id="subtitles"></div>
        <div id="fps" class="hidden">-- FPS</div>
        <div id="rec"><span class="dot"></span>REC <span id="rec-time">00:00:00</span></div>
      </div>

      <!-- Mobilní ovládání -->
      <div id="touch" class="hidden">
        <div id="joy-zone"></div>
        <div id="look-zone"></div>
        <div id="joy-base" class="hidden"><div id="joy-knob"></div></div>
        <button id="btn-use" class="tbtn" disabled>Použít</button>
        <button id="btn-light" class="tbtn">Baterka</button>
        <button id="btn-crouch" class="tbtn small">Přikrčit</button>
        <button id="btn-pause" class="tbtn small" aria-label="Pauza">II</button>
      </div>

      <!-- Telefon / obrazovka (modální) -->
      <div id="device" class="hidden">
        <div id="device-frame">
          <div id="device-head"><span id="device-title"></span><span id="device-clock"></span></div>
          <div id="device-body"></div>
          <div id="device-hint"></div>
        </div>
      </div>

      <div id="fade"></div>
      <div id="bigtext" class="hidden"></div>

      <!-- Úvodní obrazovka -->
      <div id="title" class="screen">
        <div class="title-inner">
          <h1 id="title-name"></h1>
          <div id="title-sub"></div>
          <div id="title-start" class="blink"></div>
          <div id="title-controls"></div>
        </div>
      </div>

      <!-- Pauza -->
      <div id="pause" class="screen hidden">
        <div class="panel">
          <h2>Pauza</h2>
          <button id="pause-resume">Pokračovat</button>
          <label>Citlivost <span id="sens-val"></span>
            <input id="opt-sens" type="range" min="0.2" max="3" step="0.1" />
          </label>
          <label>Hlasitost <span id="vol-val"></span>
            <input id="opt-vol" type="range" min="0" max="1" step="0.05" />
          </label>
          <label class="check"><input id="opt-ps1" type="checkbox" /> Retro PS1 vzhled</label>
          <label class="check"><input id="opt-fps" type="checkbox" /> Ukazatel FPS</label>
          <button id="pause-restart" class="secondary">Restartovat scénu</button>
        </div>
      </div>

      <!-- Konec -->
      <div id="end" class="screen hidden">
        <div class="title-inner">
          <h1 id="end-text">Konec dema</h1>
          <div id="end-sub"></div>
          <button id="end-restart">Hrát znovu</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
